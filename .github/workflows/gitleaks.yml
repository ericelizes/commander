name: gitleaks
on:
  push:
  pull_request:
jobs:
  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version: stable
      - name: Install gitleaks
        run: go install github.com/zricethezav/gitleaks/v8@v8.21.2
      # Use the trusted tool revision's vendored rules, never repository policy.
      # A push to main trusts BEFORE, not its own revision. Missing trusted tool
      # rules fail closed (including a new main); bootstrap requires review.
      # Scan history AND synthetic base-to-each-introduced-tree patches, without rename/binary
      # heuristics or inline allows. A failed/partial scan is always red.
      - name: Scan with trusted rules
        env:
          SCAN: ${{ github.sha }}
          EVENT: ${{ github.event_name }}
          REF: ${{ github.ref }}
          BEFORE: ${{ github.event.before }}
        run: |
          cfg="$RUNNER_TEMP/gitleaks"
          mkdir -p "$cfg"
          trusted=refs/remotes/origin/main
          if [ "$EVENT" = push ] && [ "$REF" = refs/heads/main ]; then
            trusted="$BEFORE"
          fi
          if [ -z "$trusted" ] || ! git cat-file -e "$trusted^{commit}" 2>/dev/null; then
            trusted= # a new main (before = 000...0): nothing trusted to read
          fi
          if [ -z "$trusted" ]; then
            echo "::error::no trusted tool revision for secret scan"
            exit 1
          fi
          git show "$trusted:internal/ship/gitleaks.toml" > "$cfg/config.toml"
          : > "$cfg/ignore"
          mkdir "$cfg/src"
          printf 'gitdir: %s\n' "$(git rev-parse --absolute-git-dir)" > "$cfg/src/.git"
          base=$(git rev-parse --verify "$trusted^{commit}")
          tip=$(git rev-parse --verify "$SCAN^{commit}")
          # Enumerate before the loop so enumeration failures cannot be hidden.
          git rev-list "$base..$tip" > "$cfg/commits"
          revs="$base..$tip"
          # Always retain base-to-tip coverage, including an empty range.
          printf '%s\n' "$tip" >> "$cfg/commits"
          while IFS= read -r commit; do
            net=$(git -c user.name='Commander scan' -c user.email=scan@example.invalid commit-tree "$commit^{tree}" -p "$base" -m 'Cumulative secret scan')
            revs="$revs $net^..$net"
          done < "$cfg/commits"
          set +e
          "$(go env GOPATH)/bin/gitleaks" detect --source "$cfg/src" \
            --log-opts "--text --no-textconv --no-ext-diff --no-renames --diff-merges=first-parent $revs" \
            --config "$cfg/config.toml" --gitleaks-ignore-path "$cfg/ignore" --ignore-gitleaks-allow \
            --log-level info --redact --no-banner --exit-code 1 -v > "$cfg/log" 2>&1
          rc=$?
          set -e
          cat "$cfg/log"
          sed 's/\x1b\[[0-9;]*m//g' "$cfg/log" > "$cfg/plain"
          if grep -Eq '^[0-9]{1,2}:[0-9]{2}[AP]M (ERR|FTL) |^[0-9]{1,2}:[0-9]{2}[AP]M [A-Z]{3} .*partial scan' "$cfg/plain"; then
            echo "::error::gitleaks did not complete the scan (see the ERR lines above)"
            exit 1
          fi
          if [ "$rc" -ne 0 ]; then exit "$rc"; fi
          if ! grep -Eq '^[0-9]{1,2}:[0-9]{2}[AP]M INF scan completed' "$cfg/plain"; then
            echo "::error::gitleaks never reported a completed scan"
            exit 1
          fi
